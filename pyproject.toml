[project]
name = "inpaint"
version = "0.1.0"
description = "Coastal NaN fill / extrapolation for xarray (iterative diffusion & Gaussian)"
authors = [{name = "tyorus"}]
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
    "xarray",
    "astropy",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
